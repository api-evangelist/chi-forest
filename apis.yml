description: 'Chi Forest (marketed as CHI FOREST) is the US-facing consumer beverage brand of the Chinese
  drinks company Genki Forest (元气森林), backed by Hongshan (Sequoia China) and IDG Capital. The company
  produces zero-sugar, zero-calorie, zero-caffeine sparkling refreshers with Asian-inspired, fruit-forward
  flavors such as guava and lychee, distributed through retailers including Costco, Amazon, and H Mart.
  It is a direct-to-consumer and retail beverage brand with a marketing/e-commerce web presence and no
  public developer platform, API, or documentation surface at this time. This profile is maintained in
  the API Evangelist network as a consumer-sector company record.'
